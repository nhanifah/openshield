[workspace]
resolver = "3"
members = ["crates/openshield-openapi", "crates/openshield-core", "crates/openshield-pingora", "crates/openshield-testkit", "crates/openshield-intel"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
openshield-openapi = { path = "crates/openshield-openapi" }
openshield-core = { path = "crates/openshield-core" }
openshield-intel = { path = "crates/openshield-intel" }

# Pinned: a moving branch let `cargo update` pull unreviewed upstream changes.
wirefilter-engine = { git = "https://github.com/cloudflare/wirefilter.git", rev = "123ab587984ebf8be297f0d531e7256046156dc9", package = "wirefilter-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
erased-serde = "0.4"
clap = { version = "4", features = ["derive"] }
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
async-trait = "0.1"
bytes = "1"
maxminddb = "0.27"
form_urlencoded = "1"
cookie = "0.18"
multer = "3"
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
prometheus = "0.14"
lazy_static = "1"
http = "1"
ip_network_table = "0.2"
ip_network = "0.4"
regex = "1"
aho-corasick = "1"
libinjectionrs = "0.1"
chrono = "0.4"
base64 = "0.22"
mimalloc = "0.1"
pingora-limits = "0.9.0"
pingora-prometheus = "0.9.0"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
sha1 = "0.11.0"
html-escape = "0.2.13"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "form"] }
hex = "0.4.3"
hmac = "0.13.0"
libc = "0.2.184"
md-5 = "0.11"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
jsonschema = { version = "0.58", default-features = false, features = ["idna"] }
matchit = "0.9"
mime = "0.3"
roxmltree = "0.20"
aws-lc-rs = "1"
